<svg xmlns="http://www.w3.org/2000/svg" width="860" height="330" viewBox="0 0 860 330" role="img" aria-label="Terminal: whoami — Antonio Carlos, Tech Lead at Luizalabs">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#1a0b2e"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a965f2"/><stop offset="1" stop-color="#00e5ff"/>
    </linearGradient>
    <clipPath id="c1"><rect x="24" y="-22" width="0" height="30"><animate attributeName="width" from="0" to="80" begin="0.4s" dur="1.2s" fill="freeze"/></rect></clipPath>
    <style>
      text { font-family: 'Fira Code', 'SFMono-Regular', Consolas, monospace; font-size: 17px; }
      .p { fill: #a965f2 } .c { fill: #e6edf3 } .k { fill: #00e5ff } .d { fill: #8b949e } .g { fill: #3fb950 }
      .l { opacity: 0; animation: show .01s forwards }
      .l1 { animation-delay: 1.8s } .l2 { animation-delay: 2.4s } .l3 { animation-delay: 3s }
      .l4 { animation-delay: 3.6s } .l5 { animation-delay: 4.2s } .l6 { animation-delay: 4.8s }
      @keyframes show { to { opacity: 1 } }
      @keyframes blink { 50% { opacity: 0 } }
      .cur { animation: blink 1s steps(1) infinite; fill: #a965f2 }
      @keyframes pulse { 50% { opacity: .55 } }
      .orb { animation: pulse 3s ease-in-out infinite }
    </style>
  </defs>
  <rect width="860" height="330" rx="14" fill="url(#bg)"/>
  <rect width="860" height="330" rx="14" fill="none" stroke="url(#glow)" stroke-width="2" class="orb"/>
  <rect y="0" width="860" height="40" rx="14" fill="#161b22"/><rect y="26" width="860" height="14" fill="#161b22"/>
  <circle cx="26" cy="20" r="6" fill="#ff5f56"/><circle cx="48" cy="20" r="6" fill="#ffbd2e"/><circle cx="70" cy="20" r="6" fill="#27c93f"/>
  <text x="430" y="25" text-anchor="middle" class="d" style="font-size:13px">juninmd@github: ~</text>

  <g transform="translate(30 76)">
    <text class="p">❯</text>
    <g clip-path="url(#c1)"><text x="24" y="0" class="c">whoami</text></g>
  </g>
  <g transform="translate(30 112)" class="l l1"><text class="k">name</text><text x="110" class="c">Antonio Carlos <tspan class="d">(juninmd)</tspan></text></g>
  <g transform="translate(30 142)" class="l l2"><text class="k">role</text><text x="110" class="c">Tech Lead <tspan class="d">@</tspan><tspan class="g">luizalabs</tspan></text></g>
  <g transform="translate(30 172)" class="l l3"><text class="k">base</text><text x="110" class="c">Franca, SP — Brasil 🇧🇷</text></g>
  <g transform="translate(30 202)" class="l l4"><text class="k">stack</text><text x="110" class="c">Java · Kotlin · TypeScript · Python · Rust</text></g>
  <g transform="translate(30 232)" class="l l5"><text class="k">now</text><text x="110" class="c">cortando tokens de LLM com <tspan class="p">tokenix</tspan> ⚡</text></g>
  <g transform="translate(30 276)" class="l l6"><text class="p">❯</text><text x="24" class="d">pronto para o próximo desafio</text><rect class="cur" x="320" y="-16" width="10" height="20"/></g>
</svg>
